name: tomenu

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tomenu
      POSTGRES_USER: tomenu
      POSTGRES_PASSWORD: secret
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tomenu -d tomenu"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./docker/php
    working_dir: /app
    volumes: ["./apps/api:/app"]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: tomenu
      DB_USERNAME: tomenu
      DB_PASSWORD: secret
      REDIS_HOST: redis
    command: php artisan serve --host=0.0.0.0 --port=8000

volumes:
  pgdata:
