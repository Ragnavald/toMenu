#cloud-config
# User-data do droplet toMenu.
#
# Só provisiona a máquina — nada de segredo aqui. O user-data fica legível
# para sempre via metadata service (169.254.169.254) e no painel da DO, então a
# senha do Postgres e a APP_KEY vão depois, por SSH, no .env.prod com permissão
# 600 — e a chave do Origin Certificate em /etc/tomenu/certs.

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - git
  - ufw
  - fail2ban
  - postgresql-client-16

# 2 GB de swap: o `docker compose build` da imagem PHP é o pico de memória do
# deploy e é o passo que morre por OOM num droplet de 2 GB sem swap.
swap:
  filename: /swapfile
  size: 2147483648
  maxsize: 2147483648

write_files:
  # swappiness baixo: o swap existe como rede de segurança para o build, não
  # para uso rotineiro — com o padrão 60 o kernel paginaria o Postgres em
  # operação normal e a latência do banco pioraria.
  - path: /etc/sysctl.d/99-tomenu.conf
    content: |
      vm.swappiness=10
      vm.overcommit_memory=1

  # Sem limite, o journal e os logs de container enchem o disco do droplet —
  # que é pequeno e é o mesmo volume do Postgres.
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }

  # Recria a TOMENU-CF a cada boot. O `-i $EXT` no DROP restringe a regra ao
  # trafego de ENTRADA: a DOCKER-USER ve os dois sentidos do forwarding, e sem
  # isso a saida dos containers para HTTPS externo tambem casa com `dports 443`
  # e e bloqueada -- o `npm ci` do storefront falha com ETIMEDOUT em todo
  # pacote, e o erro do npm nao sugere firewall em momento nenhum.
  - path: /usr/local/sbin/tomenu-cf-rules
    permissions: '0700'
    content: |
      #!/bin/bash
      set -e
      EXT=$(ip route show default | awk '{print $5; exit}')
      [ -n "$EXT" ] || exit 1
      [ -s /etc/tomenu-cf-ips-v4 ] || exit 1

      iptables -N TOMENU-CF 2>/dev/null || iptables -F TOMENU-CF
      while read -r ip; do [ -n "$ip" ] && iptables -A TOMENU-CF -s "$ip" -j RETURN; done < /etc/tomenu-cf-ips-v4
      iptables -A TOMENU-CF -i "$EXT" -p tcp -m multiport --dports 80,443 -j DROP
      iptables -A TOMENU-CF -j RETURN
      while iptables -C DOCKER-USER -j TOMENU-CF 2>/dev/null; do iptables -D DOCKER-USER -j TOMENU-CF; done
      iptables -I DOCKER-USER 1 -j TOMENU-CF

      if [ -s /etc/tomenu-cf-ips-v6 ]; then
          ip6tables -N TOMENU-CF 2>/dev/null || ip6tables -F TOMENU-CF
          while read -r ip; do [ -n "$ip" ] && ip6tables -A TOMENU-CF -s "$ip" -j RETURN; done < /etc/tomenu-cf-ips-v6
          ip6tables -A TOMENU-CF -i "$EXT" -p tcp -m multiport --dports 80,443 -j DROP
          ip6tables -A TOMENU-CF -j RETURN
          while ip6tables -C DOCKER-USER -j TOMENU-CF 2>/dev/null; do ip6tables -D DOCKER-USER -j TOMENU-CF; done
          ip6tables -I DOCKER-USER 1 -j TOMENU-CF
      fi

  - path: /etc/systemd/system/tomenu-cf-rules.service
    content: |
      [Unit]
      Description=Regras TOMENU-CF (restringe 80/443 da origem ao Cloudflare)
      # A DOCKER-USER so existe depois que o daemon do Docker sobe.
      After=docker.service network-online.target
      Requires=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/tomenu-cf-rules

      [Install]
      WantedBy=multi-user.target

runcmd:
  # --- Docker (repositório oficial; o do Ubuntu fica muito atrás) ---
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker

  # --- Firewall: SSH + 80/443 restritas ao Cloudflare ---
  # O nginx termina TLS e é a entrada pública, mas só deve receber tráfego que
  # passou pelo Cloudflare. Liberar 80/443 para 0.0.0.0/0 deixaria a origem
  # acessível pelo IP direto, contornando WAF, rate limit e cache.
  #
  # A lista vem de https://www.cloudflare.com/ips-v4 e muda raramente; o
  # cron abaixo a mantém em dia sozinho.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - curl -fsSL https://www.cloudflare.com/ips-v4 -o /etc/tomenu-cf-ips-v4
  - curl -fsSL https://www.cloudflare.com/ips-v6 -o /etc/tomenu-cf-ips-v6
  - while read -r ip; do [ -n "$ip" ] && ufw allow from "$ip" to any port 80,443 proto tcp; done < /etc/tomenu-cf-ips-v4
  - while read -r ip; do [ -n "$ip" ] && ufw allow from "$ip" to any port 80,443 proto tcp; done < /etc/tomenu-cf-ips-v6
  # O Postgres roda no host, nao em container: sem esta regra o ufw nega a
  # conexao vinda da rede do Docker e o `artisan migrate` morre com "timeout
  # expired". So a faixa privada -- a 5432 continua fechada para a internet.
  - ufw allow from 172.16.0.0/12 to any port 5432 proto tcp
  - ufw --force enable

  # O ufw sozinho NÃO protege porta publicada por container: o Docker insere as
  # próprias regras de DNAT antes da cadeia do ufw, e a 443 do nginx ficaria
  # aberta ao mundo mesmo com as regras acima. DOCKER-USER é avaliada antes das
  # regras do Docker e é o ponto de filtro suportado para isso.
  #
  # As regras em si estao em /usr/local/sbin/tomenu-cf-rules (write_files
  # acima), chamado pelo servico abaixo — mesmo caminho no boot e aqui, para
  # nao existirem duas copias da mesma logica que possam divergir.
  #
  # Sem persistir, as regras somem no primeiro reboot e a origem fica exposta.
  #
  # NAO use iptables-persistent: o pacote conflita com o ufw, e o apt REMOVE o
  # ufw ao instala-lo -- deixando INPUT com policy ACCEPT e todas as portas do
  # host abertas, sem aviso. O ufw persiste as regras dele sozinho; o servico
  # abaixo cuida so da cadeia dos containers, que o ufw nao gerencia.
  - systemctl daemon-reload
  - systemctl enable --now tomenu-cf-rules

  # Diretório do Origin Certificate. O conteúdo vai depois, por SSH: a chave
  # privada nunca entra no user-data, que é legível para sempre.
  - install -d -m 0700 /etc/tomenu/certs

  # --- SSH: só chave ---
  - sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
  - sed -i 's/^#*PermitRootLogin.*/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config
  - systemctl restart ssh

  - systemctl enable --now fail2ban
  - sysctl --system

  # Atualizações de segurança sem intervenção. Um droplet de produção que
  # ninguém atualiza vira o elo mais fraco em poucos meses.
  - apt-get install -y unattended-upgrades
  - dpkg-reconfigure -f noninteractive unattended-upgrades
