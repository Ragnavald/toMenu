; Ajustes de runtime da API.
;
; upload_max_filesize acompanha o limite de 5 MB validado nos controllers de
; upload de imagem (max:5120). post_max_size fica acima porque o corpo do POST
; carrega o arquivo mais os demais campos do formulário.
upload_max_filesize = 6M
post_max_size = 8M
memory_limit = 256M
max_execution_time = 30

expose_php = Off

; Erro nunca vai para a resposta HTTP: em JSON isso vaza caminho de arquivo e
; trecho de stack trace para o cliente. O log do container é o destino.
display_errors = Off
log_errors = On
error_log = /dev/stderr
