; OPcache em produção.
;
; validate_timestamps=0 é o ganho principal: o PHP para de checar mtime de cada
; arquivo a cada request. Em contrapartida, o código só é relido quando o
; container reinicia — que é exatamente o modelo de deploy aqui (imagem nova,
; container novo), então não há efeito colateral.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.fast_shutdown=1
