# Entrada pública da stack. Dois server blocks por hostname:
#
#   api.dominio            -> php-fpm  (Laravel)
#   dominio / *.dominio    -> storefront:3000  (Next.js)
#
# O TLS termina aqui, com o Origin Certificate do Cloudflare — wildcard de 15
# anos, sem ACME nem renovação para manter viva. Ele só é aceito por conexões
# vindas do Cloudflare, e é exatamente esse o desenho: o ufw restringe 80/443
# às faixas deles, então ninguém alcança a origem direto pelo IP.

# CF-Connecting-IP em vez de X-Forwarded-For: o Cloudflare reescreve este
# header a cada request, então ele não é falsificável pelo visitante. Com XFF o
# cliente pode enviar o header e nós o concatenaríamos ao real.
real_ip_header CF-Connecting-IP;

# Faixas do Cloudflare. Agora que a 443 está aberta à internet, confiar em
# 172.16.0.0/12 não basta: sem esta lista, quem alcançar a origem forja o IP do
# visitante e contorna qualquer rate limit por IP.
# Fonte: https://www.cloudflare.com/ips/ — revisar quando mudarem.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

gzip on;
gzip_types application/json application/javascript text/css text/plain image/svg+xml;
gzip_min_length 512;

# Toda requisição em texto puro vira redirect. O Cloudflare já força https na
# borda; isto cobre quem chegar direto na origem.
#
# Exceção: o render server-side do storefront chama a API por esta porta
# (INTERNAL_API_URL=http://nginx:80), pela rede interna do Docker. Sem o
# location abaixo, o 301 mandaria o fetch para o domínio público, a requisição
# sairia para a internet e voltaria pelo Cloudflare — que não alcança a origem
# a partir de dentro. O resultado é 502 no cardápio, e o sintoma aparece como
# notFound() no Next, sem nenhuma pista de redirect.
server {
    listen 80 default_server;
    server_name _;

    # $realip_remote_addr é o IP real da conexão, não o do X-Forwarded-For:
    # confiar no header aqui deixaria qualquer visitante pular o HTTPS
    # forjando o campo.
    location /api {
        if ($realip_remote_addr !~ "^(172\.(1[6-9]|2[0-9]|3[01])\.|10\.)") {
            return 301 https://$host$request_uri;
        }

        root /app/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass api:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /app/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   /app/public;
        # O storefront fala http aqui, mas o visitante está em https: sem isto
        # o Laravel montaria URLs absolutas com esquema errado.
        fastcgi_param HTTPS           on;

        internal;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- API -------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    http2 on;
    server_name api.to-menu.com;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /app/public;
    index index.php;

    client_max_body_size 8M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass api:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # HTTPS só é lido pelo PHP quando não-vazio; qualquer valor liga o
        # $_SERVER['HTTPS'].
        fastcgi_param HTTPS on;

        # O TrustProxies do Laravel lê estes; sem eles, url() ignora o esquema e
        # o host reais e monta o link a partir de "nginx:443".
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Só index.php é executável. Sem isto, um .php gravado em storage por um
    # upload mal validado viraria execução remota de código.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# --- Admin (build estático do Vite) ----------------------------------------
# Precisa vir antes do bloco do storefront? Não: o nginx casa server_name exato
# antes de wildcard, independentemente da ordem. Mas sem ESTE bloco,
# app.to-menu.com cairia no `*.to-menu.com` abaixo e serviria a landing.
#
# O `/api` é servido aqui pelo mesmo host de propósito: o admin passa a chamar
# a API na própria origem, o que dispensa CORS e o VITE_API_URL do build.
server {
    listen 443 ssl;
    http2 on;
    server_name app.to-menu.com;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/admin;
    index index.html;

    # Upload de imagem de produto passa por aqui.
    client_max_body_size 8M;

    # O hash no nome do arquivo já invalida o cache: pode ser agressivo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O React Router resolve as rotas no cliente: qualquer caminho precisa
    # devolver o index.html, senão um F5 em /produtos dá 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mesma origem que o admin, então o navegador não faz preflight nem exige
    # Access-Control-*. O upstream é o php-fpm da API, igual ao bloco de
    # api.to-menu.com.
    #
    # O `root` precisa mudar aqui: fora deste location ele aponta para o dist do
    # admin, e o try_files procuraria o index.php do Laravel no lugar errado.
    location /api {
        root /app/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass api:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /app/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   /app/public;
        # O Laravel monta URLs absolutas a partir daqui; sem isso, links e
        # redirects sairiam com o host errado.
        fastcgi_param HTTPS           on;

        internal;
    }
}

# Só a página da loja é cacheável no edge. O apex tem o formulário de cadastro
# e o admin é sessão pura; cachear qualquer um dos dois serviria conteúdo de um
# visitante para outro.
#
# `map` em vez de `if` dentro do location: `if` em contexto de location é
# notoriamente traiçoeiro no nginx (a diretiva add_header some em alguns
# ramos), enquanto o map é avaliado uma vez por request, sem surpresa.
map $host $storefront_cacheable {
    default                 1;
    to-menu.com             0;   # landing: formulário de cadastro
    www.to-menu.com         0;
    app.to-menu.com         0;   # admin
    api.to-menu.com         0;
}

# Vazio quando não-cacheável, para o add_header abaixo não emitir nada e o
# header original do Next prevalecer.
map $storefront_cacheable $storefront_cache_control {
    default "";
    # 60s casa com o `revalidate` da página e o `s-maxage` da API: as três
    # camadas expiram juntas. stale-while-revalidate mantém a resposta antiga
    # servindo enquanto o edge revalida, então o pico de expiração não vira
    # latência para o visitante.
    1       "public, s-maxage=60, max-age=0, stale-while-revalidate=300";
}

# --- Storefront: apex e lojas ----------------------------------------------
# O Next resolve a loja pelo Host, então apex e wildcard caem no mesmo upstream.
server {
    listen 443 ssl;
    http2 on;
    server_name to-menu.com *.to-menu.com;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 8M;

    location / {
        proxy_pass http://storefront:3000;
        proxy_http_version 1.1;

        # O Host original é o que identifica a loja; sem preservá-lo, toda
        # requisição chegaria ao Next como "storefront" e nenhuma loja
        # resolveria.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;

        # O Next marca a página como no-store porque o proxy.ts reescreve por
        # request — do ponto de vista dele, a rota é dinâmica. Mas o conteúdo
        # é o mesmo para todo visitante da loja, e o `revalidate = 60` já
        # garante que o servidor não refaz o trabalho. Sem esta sobrescrita o
        # Cloudflare devolve DYNAMIC e todo acesso atravessa até NYC.
        #
        # `always` para valer também em 404 (loja inexistente), que senão
        # bateria na origem a cada tentativa — o caminho preferido de quem
        # enumera slugs.
        proxy_hide_header Cache-Control;
        add_header Cache-Control $storefront_cache_control always;
    }
}
