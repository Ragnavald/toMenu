server {
    listen 80;
    server_name _;

    root /app/public;
    index index.php;

    # O TLS termina no Cloudflare, que cobre `dominio` e `*.dominio` com o
    # certificado universal. Sem estes cabeçalhos o Laravel gera URLs http://
    # atrás do proxy e o navegador barra o conteúdo misto.
    #
    # CF-Connecting-IP em vez de X-Forwarded-For: o Cloudflare reescreve este
    # header a cada request, então ele não é falsificável pelo visitante. Com
    # XFF o cliente pode enviar o header e nós o concatenaríamos ao real.
    real_ip_header CF-Connecting-IP;

    # O visitante sempre chega por https (o Cloudflare redireciona http->https
    # na borda), então o esquema é fixo em vez de derivado do header. Isso torna
    # a origem imune ao modo do painel: mesmo em "Flexible", onde o Cloudflare
    # fala HTTP conosco e não manda X-Forwarded-Proto, o Laravel continua
    # gerando URLs https:// e o navegador não barra conteúdo misto.
    set $forwarded_proto https;

    # A porta 80 escuta só em loopback (ver docker-compose.prod.yml), e quem
    # chega aqui vem do cloudflared. Confiar no gateway do Docker é suficiente e
    # dispensa manter a lista de faixas do Cloudflare em dia; trocar por
    # 0.0.0.0/0 permitiria a qualquer origem forjar o IP do visitante e
    # contornar rate limit baseado em IP.
    set_real_ip_from 172.16.0.0/12;

    client_max_body_size 8M;

    # Compressão: o payload do cardápio é JSON e comprime muito bem — é o
    # endpoint mais lido da plataforma.
    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 512;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass api:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # HTTPS só é lido pelo PHP quando não-vazio; qualquer valor liga o
        # $_SERVER['HTTPS']. Antes vinha de $http_x_forwarded_proto, que fica
        # vazio se o proxy não mandar o header — e aí o Laravel gerava http://.
        fastcgi_param HTTPS on;

        # O TrustProxies do Laravel lê estes; sem eles, url() ignora o esquema e
        # o host reais e monta o link a partir de "nginx:80".
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Só index.php é executável. Sem isto, um .php gravado em storage por um
    # upload mal validado viraria execução remota de código.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
