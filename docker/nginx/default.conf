# Entrada pública da stack. Dois server blocks por hostname:
#
#   api.dominio            -> php-fpm  (Laravel)
#   dominio / *.dominio    -> storefront:3000  (Next.js)
#
# O TLS termina aqui, com o Origin Certificate do Cloudflare — wildcard de 15
# anos, sem ACME nem renovação para manter viva. Ele só é aceito por conexões
# vindas do Cloudflare, e é exatamente esse o desenho: o ufw restringe 80/443
# às faixas deles, então ninguém alcança a origem direto pelo IP.

# CF-Connecting-IP em vez de X-Forwarded-For: o Cloudflare reescreve este
# header a cada request, então ele não é falsificável pelo visitante. Com XFF o
# cliente pode enviar o header e nós o concatenaríamos ao real.
real_ip_header CF-Connecting-IP;

# Faixas do Cloudflare. Agora que a 443 está aberta à internet, confiar em
# 172.16.0.0/12 não basta: sem esta lista, quem alcançar a origem forja o IP do
# visitante e contorna qualquer rate limit por IP.
# Fonte: https://www.cloudflare.com/ips/ — revisar quando mudarem.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

gzip on;
gzip_types application/json application/javascript text/css text/plain image/svg+xml;
gzip_min_length 512;

# Toda requisição em texto puro vira redirect. O Cloudflare já força https na
# borda; isto cobre quem chegar direto na origem.
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# --- API -------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    http2 on;
    server_name api.to-menu.com;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /app/public;
    index index.php;

    client_max_body_size 8M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass api:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # HTTPS só é lido pelo PHP quando não-vazio; qualquer valor liga o
        # $_SERVER['HTTPS'].
        fastcgi_param HTTPS on;

        # O TrustProxies do Laravel lê estes; sem eles, url() ignora o esquema e
        # o host reais e monta o link a partir de "nginx:443".
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Só index.php é executável. Sem isto, um .php gravado em storage por um
    # upload mal validado viraria execução remota de código.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# --- Storefront: apex e lojas ----------------------------------------------
# O Next resolve a loja pelo Host, então apex e wildcard caem no mesmo upstream.
server {
    listen 443 ssl;
    http2 on;
    server_name to-menu.com *.to-menu.com;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 8M;

    location / {
        proxy_pass http://storefront:3000;
        proxy_http_version 1.1;

        # O Host original é o que identifica a loja; sem preservá-lo, toda
        # requisição chegaria ao Next como "storefront" e nenhuma loja
        # resolveria.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
