# Stack de produção da API.
#
# Diferenças relevantes para o docker-compose.yml de desenvolvimento:
#
# - PHP-FPM atrás de nginx, não `php artisan serve` (single-threaded).
# - Código copiado para a imagem, não montado por volume.
# - Worker de fila como serviço próprio: hoje QUEUE_CONNECTION=database e
#   NotifyNewOrder/ProcessStripeEvent são ShouldQueue. Sem este processo, o
#   restaurante nunca é avisado do pedido e o webhook do Stripe nunca é
#   processado — falha silenciosa, porque o job só fica enfileirado.
# - Sem Postgres: o banco roda no host ou é gerenciado. Rodar o banco de
#   produção como container efêmero ao lado da aplicação convida a perda de
#   dados num `docker compose down -v`.
#
# Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: tomenu-prod

x-api: &api
  build:
    context: .
    dockerfile: docker/php/Dockerfile.prod
  restart: unless-stopped
  # Configuração vem de arquivo, nunca embutida na imagem. APP_ENV_FILE permite
  # apontar para outro arquivo sem editar este compose.
  env_file: ["${APP_ENV_FILE:-apps/api/.env}"]
  # O Postgres roda no host, não como container (ver DEPLOY.md). No Linux o
  # nome `host.docker.internal` não existe por padrão; esta linha o cria
  # apontando para o gateway da rede do compose. Fixar o IP no .env seria
  # frágil: cada projeto ganha uma rede com gateway diferente.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    redis:
      condition: service_healthy
  volumes:
    # Único estado que precisa sobreviver ao container. As imagens vão para o
    # R2; isto cobre o fallback local e os logs.
    - storage:/app/storage

services:
  api:
    <<: *api
    expose: ["9000"]
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Copia public/ da imagem da API para o volume compartilhado com o nginx, a
  # cada `up`, para que um deploy novo também atualize os estáticos.
  public-sync:
    <<: *api
    restart: "no"
    depends_on: []
    # root apenas aqui: o volume é criado pertencendo ao root e o usuário da
    # imagem (www-data) não conseguiria escrever nele. O container encerra logo
    # após a cópia; nada fica rodando privilegiado.
    user: root
    command: sh -c "cp -r /app/public/. /public-out/"
    volumes:
      - public:/public-out

  # Builda o admin e despeja o dist/ no volume que o nginx serve. Mesmo padrão
  # do public-sync: roda uma vez a cada `up` e encerra.
  admin-build:
    build:
      context: .
      dockerfile: docker/admin/Dockerfile.prod
      args:
        # Vazio de propósito: o nginx serve /api no mesmo host do admin, então
        # o caminho relativo funciona e não há CORS envolvido. Preencher só se
        # o admin passar a ser hospedado fora do droplet.
        VITE_API_URL: ${VITE_API_URL:-}
        # Sitekey pública do Turnstile — protege o login contra brute force.
        # Sem ela o widget não aparece e a verificação de robô fica desligada.
        VITE_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
        # Alerta de pedido novo. A chave é a mesma REVERB_APP_KEY da API e é
        # pública por natureza — a autorização de cada canal é do backend.
        # Sem ela o painel não conecta e a cozinha não é avisada.
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?defina REVERB_APP_KEY}
        # Host público do WebSocket, com TLS terminado no nginx. Porta 443 e
        # esquema https porque quem o navegador enxerga é o proxy, não o
        # processo do Reverb.
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:?defina VITE_REVERB_HOST}
        VITE_REVERB_PORT: "443"
        VITE_REVERB_SCHEME: https
    restart: "no"
    # O volume nasce pertencendo ao root; a imagem alpine já roda como root, mas
    # explicitar evita surpresa se a base mudar.
    user: root
    command: sh -c "rm -rf /admin-out/* && cp -r /dist/. /admin-out/"
    volumes:
      - admin:/admin-out

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Entrada pública da stack. O TLS termina aqui, com o Origin Certificate do
    # Cloudflare (ver DEPLOY.md §4) — um wildcard de 15 anos, sem ACME nem
    # renovação automática para manter funcionando.
    #
    # A 80 existe só para redirecionar ao https; o tráfego real entra pela 443.
    # O ufw restringe ambas às faixas do Cloudflare, então o IP do droplet não
    # responde a varredura direta.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Origin Certificate + chave, gerados no painel do Cloudflare e colados no
      # droplet. Fora do repositório de propósito: a chave privada nunca entra
      # no git nem na imagem.
      - /etc/tomenu/certs:/etc/nginx/certs:ro
      # nginx serve os estáticos direto do disco, sem passar pelo PHP; por isso
      # precisa enxergar o mesmo public/ que o FPM. O conteúdo vem da imagem da
      # API — um volume nomeado aqui mascararia o diretório e deixaria o nginx
      # servindo um public/ vazio.
      - public:/app/public:ro
      - storage:/app/storage:ro
      # Build estático do admin (Vite), servido em app.to-menu.com. Populado
      # pelo admin-build, pelo mesmo motivo do public-sync acima.
      - admin:/usr/share/nginx/admin:ro
    # Popula o volume `public` a partir da imagem da API antes do nginx subir.
    # Volume nomeado só copia o conteúdo do container na primeira criação, e
    # quem monta public/ é o nginx, que não tem esses arquivos.
    depends_on:
      api:
        condition: service_started
      public-sync:
        condition: service_completed_successfully
      admin-build:
        condition: service_completed_successfully

  # Storefront (Next.js) em modo standalone. Roda ao lado da API de propósito:
  # o render no servidor busca o cardápio a cada request (cache: 'no-store'), e
  # pela rede interna isso custa ~1ms em vez da ida e volta até o edge.
  storefront:
    build:
      context: .
      dockerfile: docker/storefront/Dockerfile.prod
      # NEXT_PUBLIC_* são inlined no bundle durante o build, não lidas em
      # runtime — precisam vir como argumento, não como environment.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?defina NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:?defina NEXT_PUBLIC_ROOT_DOMAIN}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-}
        # Mesma sitekey do admin: a Cloudflare aceita vários domínios por
        # widget, então uma chave só cobre o cadastro e o login.
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    expose: ["3000"]
    environment:
      # Só o render no servidor usa esta: encurta o caminho até a API, sem sair
      # para a internet. O browser continua usando NEXT_PUBLIC_API_URL.
      INTERNAL_API_URL: http://nginx:80
      NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN}
    depends_on:
      nginx:
        condition: service_started

  worker:
    <<: *api
    # --max-time recicla o processo de hora em hora: worker de fila é um daemon
    # PHP de vida longa, e reiniciar periodicamente evita que vazamento de
    # memória acumule até o OOM.
    # Só a fila default: relatórios têm worker próprio (reports-worker) para que
    # um PDF de meses de pedidos nunca atrase o aviso de pedido novo na cozinha.
    command: php artisan queue:work --queue=default --tries=3 --backoff=10 --max-time=3600 --sleep=3
    # Lê /proc/1/cmdline em vez de `pgrep`: a imagem PHP não traz procps, e o
    # healthcheck com pgrep falha sempre com "pgrep: not found" — o container
    # aparece unhealthy mesmo com o worker consumindo a fila normalmente.
    # O comando é o PID 1 do container, então basta conferir o cmdline dele.
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'queue:work' || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3

  # Worker dedicado às exportações de PDF.
  #
  # Separado do worker principal por dois motivos: isola o pico de memória do
  # dompdf, e mantém a fila de pedidos fluindo enquanto um relatório longo é
  # renderizado. `--memory=256` derruba o processo antes que ele chegue perto do
  # limite do PHP, e a fila reentrega o job pendente ao próximo processo.
  reports-worker:
    <<: *api
    command: >
      php artisan queue:work --queue=reports
      --tries=2 --backoff=30 --timeout=240 --memory=256 --max-time=3600 --sleep=5
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'queue:work' || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3

  scheduler:
    <<: *api
    # `schedule:work` bloqueia e dispara os comandos agendados no minuto certo,
    # sem depender de cron no host.
    command: php artisan schedule:work

  # Servidor WebSocket que leva o pedido novo até o painel da cozinha.
  #
  # `expose` e não `ports`: quem termina o TLS é o nginx, que faz o upgrade da
  # conexão em ws.to-menu.com. Publicar a porta no host abriria o Reverb sem
  # TLS direto na internet, e o navegador recusaria o ws:// numa página https.
  reverb:
    <<: *api
    # Endereço de escuta vem de REVERB_SERVER_HOST/PORT no .env.prod, separado
    # do REVERB_HOST que o worker usa para publicar o evento.
    command: php artisan reverb:start
    expose: ["8080"]
    # Verifica a porta, não o /proc/1/cmdline usado pelos workers: ler o cmdline
    # do PID 1 fazia o Reverb encerrar graciosamente (ExitCode 0) a cada
    # healthcheck, e o `restart: unless-stopped` o reerguia — um ciclo de
    # reinício a cada 60s que derrubava toda conexão aberta do painel.
    #
    # Abrir e fechar um socket é o teste que de fato importa aqui: se a porta
    # não aceita conexão, o WebSocket está morto mesmo com o processo vivo.
    #
    # `bash` explícito: /dev/tcp é recurso do bash, e o CMD-SHELL usa `sh`
    # (dash nesta imagem), onde o teste falha com "No such file".
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly: a fila e o cache passam por aqui. Sem persistência, um restart
    # do container descarta jobs ainda não processados.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  storage:
  public:
  admin:
  redis:
